<!DOCTYPE html>
<html>
<head>
    <title>Horizontal Frame Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo-container">
    <img src="ideal logo.png" alt="Logo" class="logo">
</div>

<h2>Select Frame (Horizontal)</h2>

<div class="frame-list">
    <img src="frame1.jpeg" class="thumb active" data-frame="frame1">
    <img src="frame2.jpeg" class="thumb" data-frame="frame2">
    <img src="frame3.jpeg" class="thumb" data-frame="frame3">
    <img src="frame4.jpeg" class="thumb" data-frame="frame4">
</div>

<h2>Upload Your Image</h2>
<input type="file" id="upload" accept="image/*">

<div class="frame-container">
    
    <div class="inner-photo">
        <img id="preview" src="">
    </div>

    <img id="frameImage" src="frame1.jpeg" class="frame">

</div>

<script src="script.js"></script>

</body>
</html>
