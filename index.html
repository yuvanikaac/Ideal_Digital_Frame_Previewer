<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="landing.css">
</head>

-->

<!--
            <p>
                10x10, 10x12,<br>
                10x15, 12x8,<br>
                12x12
            </p>
-->

        <div class="card" data-category="large">

            <h2>Large Size Frames</h2>
<!--
            <p>
                12x15, 12x18,<br>
                16x20, 16x24,<br>
