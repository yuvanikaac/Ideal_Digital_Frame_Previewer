<!DOCTYPE html>
<html>
<head>
    <title>Select Orientation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../navigation.css">

    
</head>
<body>

    <!-- LOGO -->
    <div class="logo-container">
        <img src="../ideal logo.png" alt="Logo" class="logo">
    </div>

    <!-- TITLE -->
    <h1>Select Orientation</h1>

    <p class="subtitle">
        Choose your preferred frame layout
    </p>

    <!-- ORIENTATION CARDS -->
    <div class="container">

        <!-- VERTICAL -->
        <div class="card" data-orientation="vertical">

            <img src="../vertical/frame1.png">

            <h2>Vertical</h2>

        </div>

        <!-- HORIZONTAL -->
        <div class="card" data-orientation="horizontal">

            <img src="../horizontal/frame1.png">

            <h2>Horizontal</h2>

        </div>

    </div>

    <script src="script.js"></script>
    <script src="../navigation.js"></script>

<script>
    createNavigation(2);
</script>

</body>
</html>
