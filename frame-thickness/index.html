<!DOCTYPE html>
<html>
<head>
    <title>Select Frame Thickness</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGO -->
    <div class="logo-container">
        <img src="../ideal logo.png" alt="Logo" class="logo">
    </div>

    <!-- TITLE -->
    <h1>Select Frame Thickness</h1>

    <p class="subtitle">
        Choose your preferred frame border thickness
    </p>

    <!-- THICKNESS CARDS -->
    <div class="container">

        <div class="card" data-thickness="0.5 inch">
            <h2>0.5 Inch</h2>
        </div>

        <div class="card" data-thickness="1 inch">
            <h2>1 Inch</h2>
        </div>

        <div class="card" data-thickness="1.5 inch">
            <h2>1.5 Inch</h2>
        </div>

        <div class="card" data-thickness="2 inch">
            <h2>2 Inch</h2>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
